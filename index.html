<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>实时双语同传 2.0 | Live Simultaneous Interpretation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .pulse-ring { animation: pulseRing 1.4s infinite; }
    @keyframes pulseRing {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.2); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden font-sans">

  <!-- 顶部栏 -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-3.5 flex flex-wrap items-center justify-between gap-4 shrink-0">
    <div class="flex items-center gap-3">
      <div id="statusDot" class="w-3 h-3 rounded-full bg-slate-600"></div>
      <h1 class="text-base md:text-lg font-semibold tracking-wide text-white">实时双语同传工作台</h1>
      <span id="providerBadge" class="text-xs px-2.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 font-mono">
        火山引擎 · 同声传译 2.0
      </span>
    </div>

    <div class="flex flex-wrap items-center gap-2.5">
      <!-- 源语言 -->
      <div class="flex items-center bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1 text-xs">
        <span class="text-slate-400 mr-1.5">源语言:</span>
        <select id="sourceLang" class="bg-transparent text-slate-100 focus:outline-none">
          <option value="en" data-speech="en-GB" selected>英语 (en)</option>
          <option value="zh" data-speech="zh-CN">中文 (zh)</option>
          <option value="ja" data-speech="ja-JP">日语 (ja)</option>
        </select>
      </div>

      <span class="text-slate-500 text-xs">➔</span>

      <!-- 目标语言 -->
      <div class="flex items-center bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1 text-xs">
        <span class="text-slate-400 mr-1.5">目标语言:</span>
        <select id="targetLang" class="bg-transparent text-slate-100 focus:outline-none">
          <option value="zh" selected>简体中文 (zh)</option>
          <option value="en">English (en)</option>
        </select>
      </div>

      <!-- 录音/同传开关 -->
      <button id="toggleRecBtn" onclick="toggleInterpretation()" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition shadow">
        <span id="recBtnText">开启同传</span>
      </button>

      <!-- 导出 Markdown -->
      <button onclick="exportMarkdown()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm px-3 py-1.5 rounded-lg border border-slate-700 transition">
        导出记录
      </button>

      <!-- 清空 -->
      <button onclick="clearAll()" class="bg-slate-800 hover:bg-rose-600/80 text-slate-300 hover:text-white text-sm px-3 py-1.5 rounded-lg border border-slate-700 transition">
        清空
      </button>

      <!-- 接口设置 -->
      <button onclick="openSettings()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-3.5 py-1.5 rounded-lg transition">
        ⚙️ 接口配置
      </button>
    </div>
  </header>

  <!-- 实时流状态条 -->
  <div class="bg-slate-900/60 border-b border-slate-800/80 px-6 py-2 flex items-center justify-between text-xs shrink-0">
    <div class="flex items-center gap-2.5 truncate">
      <span id="modeTag" class="px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-mono">待机中</span>
      <span id="streamPreview" class="text-slate-400 italic truncate">点击右上角「开启同传」开始实时收音与同传...</span>
    </div>
    <span id="latencyBadge" class="text-slate-500 font-mono shrink-0">延迟: -- ms</span>
  </div>

  <!-- 双栏同传显示区 -->
  <main class="flex-1 grid grid-cols-1 md:grid-cols-2 overflow-hidden divide-y md:divide-y-0 md:divide-x divide-slate-800">
    <!-- 左栏：实时原文 (ASR) -->
    <section class="flex flex-col h-full overflow-hidden bg-slate-950">
      <div class="px-6 py-2.5 bg-slate-900/40 border-b border-slate-800/80 flex justify-between items-center text-xs font-semibold text-slate-400 uppercase tracking-wider">
        <span>实时识别原文 (Source ASR)</span>
        <span id="sentenceCount">0 句</span>
      </div>
      <div id="sourceList" class="flex-1 overflow-y-auto p-6 space-y-3.5"></div>
    </section>

    <!-- 右栏：实时同传译文 (Translation) -->
    <section class="flex flex-col h-full overflow-hidden bg-slate-900/20">
      <div class="px-6 py-2.5 bg-slate-900/40 border-b border-slate-800/80 flex justify-between items-center text-xs font-semibold text-slate-400 uppercase tracking-wider">
        <span>同声传译结果 (Target Stream)</span>
        <span id="engineInfo" class="font-mono text-slate-500">volc-si-2.0</span>
      </div>
      <div id="targetList" class="flex-1 overflow-y-auto p-6 space-y-3.5"></div>
    </section>
  </main>

  <!-- 底部调试/直传输入栏 -->
  <footer class="bg-slate-900 border-t border-slate-800 px-6 py-2.5 flex gap-3 shrink-0">
    <input id="quickInput" type="text" placeholder="直接输入外文句子按回车，测试当前同传/翻译 API 连通性..." 
      class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-4 py-1.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"
      onkeydown="if(event.key==='Enter') triggerManualTranslate()" />
    <button onclick="triggerManualTranslate()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition">
      直传测试
    </button>
  </footer>

  <!-- 接口配置弹窗（动态适配不同模型，同传 2.0 绝无提示词框） -->
  <div id="settingsModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-xl max-w-lg w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h2 class="text-base font-semibold text-white">配置同传 / 翻译接口</h2>
        <button onclick="closeSettings()" class="text-slate-400 hover:text-white text-xl leading-none">&times;</button>
      </div>

      <!-- 接口类型选择 -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">选择接口引擎 (自动匹配专属参数)</label>
        <select id="providerSelect" onchange="renderConfigForm()" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
          <option value="volc_si2">火山引擎 · 同声传译 2.0 (专用同传接口 / 无提示词)</option>
          <option value="aliyun_mt">阿里云百炼 · 专用翻译 Qwen-MT (无提示词)</option>
          <option value="openai">OpenAI 官方接口 (GPT-4o-mini / GPT-4o)</option>
          <option value="deepseek">DeepSeek 接口 (deepseek-chat)</option>
        </select>
      </div>

      <!-- 动态表单渲染区 -->
      <div id="dynamicFields" class="space-y-3.5"></div>

      <div class="bg-slate-950 border border-slate-800 rounded-lg p-3 text-xs text-slate-400 leading-relaxed">
        🔒 密钥仅保存在本地浏览器 <code>localStorage</code> 中，不会上传至 GitHub。
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <button onclick="closeSettings()" class="px-4 py-1.5 rounded-lg text-sm bg-slate-800 hover:bg-slate-700 text-slate-300 transition">取消</button>
        <button onclick="saveSettings()" class="px-5 py-1.5 rounded-lg text-sm bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition">保存生效</button>
      </div>
    </div>
  </div>

  <script>
    // 不同服务商的专属配置规范（区分「无提示词专用同传/翻译接口」与「通用接口」）
    const PROVIDERS = {
      volc_si2: {
        name: '火山引擎 · 同传 2.0',
        type: 'dedicated_si', // 专用同传，无 Prompt
        fields: [
          { key: 'apiKey', label: 'API Key (x-api-key / Bearer Key)', type: 'password', placeholder: '填入火山引擎同传 2.0 的 API Key' },
          { key: 'resourceId', label: '服务资源 ID (Resource ID)', type: 'text', default: 'volc.service_type.10053', placeholder: '默认: volc.service_type.10053 (同传2.0)' },
          { key: 'endpoint', label: '同传接口地址 (WebSocket / HTTP Endpoint)', type: 'text', default: 'wss://openspeech.bytedance.com/api/v3/sauc/bigmodel', placeholder: '填入火山同传 2.0 接入地址或本地代理地址' },
          { key: 'model', label: '模型标识 / 接入点 (选填)', type: 'text', default: 'doubao-simultaneous-2.0', placeholder: '若使用方舟接入点可填 ep-xxxx' }
        ],
        hint: '火山同声传译 2.0 直接通过源语言(source_language)与目标语言(target_language)参数驱动，无需任何提示词。'
      },
      aliyun_mt: {
        name: '阿里云 · Qwen-MT 专用翻译',
        type: 'dedicated_mt', // 专用翻译模型，通过 translation_options 传语言，无 Prompt
        fields: [
          { key: 'apiKey', label: '阿里云百炼 API Key', type: 'password', placeholder: 'sk-xxxxxxxxxxxxxxxxxxxxxxxx' },
          { key: 'model', label: '专用翻译模型名称', type: 'text', default: 'qwen-mt-turbo', placeholder: 'qwen-mt-turbo 或 qwen-mt-plus' },
          { key: 'endpoint', label: '接口地址', type: 'text', default: 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions', placeholder: '' }
        ],
        hint: '阿里云 Qwen-MT 为专用机器翻译模型，直接通过 translation_options 指定源语言和目标语言，不使用系统提示词。'
      },
      openai: {
        name: 'OpenAI',
        type: 'general_llm',
        fields: [
          { key: 'apiKey', label: 'OpenAI API Key', type: 'password', placeholder: 'sk-proj-xxxxxxxxxxxxxxxx' },
          { key: 'model', label: '模型名称', type: 'text', default: 'gpt-4o-mini', placeholder: 'gpt-4o-mini / gpt-4o' },
          { key: 'endpoint', label: 'Endpoint URL', type: 'text', default: 'https://api.openai.com/v1/chat/completions', placeholder: '' }
        ],
        hint: 'OpenAI 通用接口，由系统自动按顶部选择的语言组装翻译指令。'
      },
      deepseek: {
        name: 'DeepSeek',
        type: 'general_llm',
        fields: [
          { key: 'apiKey', label: 'DeepSeek API Key', type: 'password', placeholder: 'sk-xxxxxxxxxxxxxxxxxxxxxxxx' },
          { key: 'model', label: '模型名称', type: 'text', default: 'deepseek-chat', placeholder: 'deepseek-chat' },
          { key: 'endpoint', label: 'Endpoint URL', type: 'text', default: 'https://api.deepseek.com/chat/completions', placeholder: '' }
        ],
        hint: 'DeepSeek 官方接口，自动根据顶部语言栏执行直译。'
      }
    };

    let state = {
      provider: localStorage.getItem('si_provider') || 'volc_si2',
      configs: JSON.parse(localStorage.getItem('si_configs') || '{}'),
      isRunning: false,
      recognition: null,
      ws: null,
      records: []
    };

    // 初始化默认参数
    Object.keys(PROVIDERS).forEach(pKey => {
      if (!state.configs[pKey]) state.configs[pKey] = {};
      PROVIDERS[pKey].fields.forEach(f => {
        if (state.configs[pKey][f.key] === undefined && f.default) {
          state.configs[pKey][f.key] = f.default;
        }
      });
    });

    function init() {
      updateBadges();
      initBrowserASR();
    }

    function updateBadges() {
      const p = PROVIDERS[state.provider];
      const cfg = state.configs[state.provider] || {};
      document.getElementById('providerBadge').textContent = p.name;
      document.getElementById('engineInfo').textContent = cfg.model || cfg.resourceId || state.provider;
    }

    // 弹窗与动态表单
    function openSettings() {
      document.getElementById('providerSelect').value = state.provider;
      renderConfigForm();
      document.getElementById('settingsModal').classList.remove('hidden');
      document.getElementById('settingsModal').classList.add('flex');
    }

    function closeSettings() {
      document.getElementById('settingsModal').classList.add('hidden');
      document.getElementById('settingsModal').classList.remove('flex');
    }

    function renderConfigForm() {
      const pKey = document.getElementById('providerSelect').value;
      const spec = PROVIDERS[pKey];
      const saved = state.configs[pKey] || {};
      const container = document.getElementById('dynamicFields');

      let html = '';
      spec.fields.forEach(f => {
        const val = saved[f.key] !== undefined ? saved[f.key] : (f.default || '');
        html += `
          <div>
            <label class="block text-xs font-medium text-slate-300 mb-1">${f.label}</label>
            <input id="field_${f.key}" type="${f.type}" value="${escapeAttr(val)}" placeholder="${f.placeholder || ''}"
              class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3.5 py-2 text-xs text-white font-mono focus:outline-none focus:border-indigo-500" />
          </div>
        `;
      });

      html += `<p class="text-xs text-indigo-300/90 bg-indigo-950/40 border border-indigo-800/40 rounded-lg p-2.5">${spec.hint}</p>`;
      container.innerHTML = html;
    }

    function saveSettings() {
      const pKey = document.getElementById('providerSelect').value;
      state.provider = pKey;
      if (!state.configs[pKey]) state.configs[pKey] = {};

      PROVIDERS[pKey].fields.forEach(f => {
        const el = document.getElementById(`field_${f.key}`);
        if (el) state.configs[pKey][f.key] = el.value.trim();
      });

      localStorage.setItem('si_provider', state.provider);
      localStorage.setItem('si_configs', JSON.stringify(state.configs));
      updateBadges();
      closeSettings();
    }

    // 语音采集与实时识别流水线
    function initBrowserASR() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true;

      rec.onresult = (event) => {
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const text = event.results[i][0].transcript.trim();
          if (event.results[i].isFinal) {
            if (text) processSentence(text);
          } else {
            interim += text + ' ';
          }
        }
        document.getElementById('streamPreview').textContent = interim || '正在收音...';
      };

      rec.onend = () => {
        if (state.isRunning) {
          const sel = document.getElementById('sourceLang');
          rec.lang = sel.options[sel.selectedIndex].getAttribute('data-speech') || 'en-GB';
          try { rec.start(); } catch (e) {}
        }
      };

      state.recognition = rec;
    }

    function toggleInterpretation() {
      if (!state.recognition) {
        alert('请使用 Chrome 或 Edge 浏览器开启实时麦克风收音。');
        return;
      }
      const btn = document.getElementById('toggleRecBtn');
      const btnText = document.getElementById('recBtnText');
      const dot = document.getElementById('statusDot');
      const modeTag = document.getElementById('modeTag');

      if (!state.isRunning) {
        const sel = document.getElementById('sourceLang');
        state.recognition.lang = sel.options[sel.selectedIndex].getAttribute('data-speech') || 'en-GB';
        state.recognition.start();
        state.isRunning = true;

        btnText.textContent = '停止同传';
        btn.className = 'flex items-center gap-2 bg-rose-600 hover:bg-rose-500 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition shadow';
        dot.className = 'w-3 h-3 rounded-full bg-emerald-400 pulse-ring';
        modeTag.textContent = '实时同传中';
        modeTag.className = 'px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-mono';
        document.getElementById('streamPreview').textContent = '正在监听音频流...';
      } else {
        state.isRunning = false;
        state.recognition.stop();

        btnText.textContent = '开启同传';
        btn.className = 'flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition shadow';
        dot.className = 'w-3 h-3 rounded-full bg-slate-600';
        modeTag.textContent = '已暂停';
        modeTag.className = 'px-2 py-0.5 rounded bg-slate-800 text-slate-400 font-mono';
      }
    }

    function triggerManualTranslate() {
      const input = document.getElementById('quickInput');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      processSentence(text);
    }

    async function processSentence(sourceText) {
      const id = Date.now() + Math.random().toString(36).slice(2, 6);
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      const item = { id, time, source: sourceText, target: '' };
      state.records.push(item);
      document.getElementById('sentenceCount').textContent = `${state.records.length} 句`;

      // 左栏原文卡片
      const srcBox = document.createElement('div');
      srcBox.className = 'bg-slate-900 border border-slate-800 rounded-lg p-3.5 space-y-1';
      srcBox.innerHTML = `
        <div class="text-xs text-slate-500 font-mono">${time}</div>
        <div class="text-slate-100 text-sm leading-relaxed">${escapeHtml(sourceText)}</div>
      `;
      const srcList = document.getElementById('sourceList');
      srcList.appendChild(srcBox);
      srcList.scrollTop = srcList.scrollHeight;

      // 右栏同传译文卡片
      const tgtBox = document.createElement('div');
      tgtBox.className = 'bg-slate-900/60 border border-slate-800/80 rounded-lg p-3.5 space-y-1';
      tgtBox.innerHTML = `
        <div class="text-xs text-indigo-400/80 font-mono">${time} · ${PROVIDERS[state.provider].name}</div>
        <div id="tgt_${id}" class="text-slate-400 text-sm leading-relaxed animate-pulse">同传引擎处理中...</div>
      `;
      const tgtList = document.getElementById('targetList');
      tgtList.appendChild(tgtBox);
      tgtList.scrollTop = tgtList.scrollHeight;

      const t0 = performance.now();
      const translated = await dispatchTranslation(sourceText);
      const dt = Math.round(performance.now() - t0);
      document.getElementById('latencyBadge').textContent = `延迟: ${dt} ms`;

      item.target = translated;
      const targetNode = document.getElementById(`tgt_${id}`);
      if (targetNode) {
        targetNode.classList.remove('animate-pulse', 'text-slate-400');
        targetNode.classList.add('text-emerald-50');
        targetNode.textContent = translated;
      }
      tgtList.scrollTop = tgtList.scrollHeight;
    }

    // 核心路由：按不同平台组装无提示词或专用请求体
    async function dispatchTranslation(text) {
      const cfg = state.configs[state.provider] || {};
      if (!cfg.apiKey) {
        return '⚠️ 请先点击右上角「接口配置」填入 API Key';
      }

      const srcLang = document.getElementById('sourceLang').value;
      const tgtLang = document.getElementById('targetLang').value;

      try {
        // 1. 火山引擎 · 同声传译 2.0（无提示词，直接传语言代码与载荷）
        if (state.provider === 'volc_si2') {
          // 如果填入的是 HTTP/方舟同传端点，直接发起无 Prompt 请求
          const endpoint = cfg.endpoint.startsWith('wss://')
            ? 'https://ark.cn-beijing.volces.com/api/v3/chat/completions'
            : cfg.endpoint;

          const res = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${cfg.apiKey}`,
              'X-Api-Key': cfg.apiKey,
              'X-Api-Resource-Id': cfg.resourceId || 'volc.service_type.10053'
            },
            body: JSON.stringify({
              model: cfg.model || 'doubao-simultaneous-2.0',
              source_language: srcLang,
              target_language: tgtLang,
              messages: [{ role: 'user', content: text }],
              temperature: 0.1
            })
          });

          if (!res.ok) {
            const err = await res.text();
            return `❌ 火山同传接口返回 (${res.status}): ${err.slice(0, 140)}`;
          }
          const data = await res.json();
          return data.translation || data.choices?.[0]?.message?.content?.trim() || JSON.stringify(data);
        }

        // 2. 阿里云百炼 · Qwen-MT 专用翻译模型（无提示词，使用官方 translation_options）
        if (state.provider === 'aliyun_mt') {
          const langMap = { zh: 'Chinese', en: 'English', ja: 'Japanese' };
          const res = await fetch(cfg.endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${cfg.apiKey}`
            },
            body: JSON.stringify({
              model: cfg.model || 'qwen-mt-turbo',
              messages: [{ role: 'user', content: text }],
              translation_options: {
                source_lang: langMap[srcLang] || 'auto',
                target_lang: langMap[tgtLang] || 'Chinese'
              }
            })
          });

          if (!res.ok) {
            const err = await res.text();
            return `❌ 阿里云翻译报错 (${res.status}): ${err.slice(0, 140)}`;
          }
          const data = await res.json();
          return data.choices?.[0]?.message?.content?.trim() || '⚠️ 译文为空';
        }

        // 3. OpenAI / DeepSeek 通用接口（后台自动根据语言对映射，无需用户配置提示词）
        const langName = tgtLang === 'zh' ? '简体中文' : 'English';
        const res = await fetch(cfg.endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${cfg.apiKey}`
          },
          body: JSON.stringify({
            model: cfg.model,
            messages: [
              { role: 'system', content: `Translate directly into ${langName}. Output only the translation.` },
              { role: 'user', content: text }
            ],
            temperature: 0.1
          })
        });

        if (!res.ok) {
          const err = await res.text();
          return `❌ 接口错误 (${res.status}): ${err.slice(0, 140)}`;
        }
        const data = await res.json();
        return data.choices?.[0]?.message?.content?.trim() || '⚠️ 译文为空';

      } catch (e) {
        return `❌ 请求失败 (请检查网络或跨域限制): ${e.message}`;
      }
    }

    function clearAll() {
      if (!confirm('确认清空当前同传记录？')) return;
      state.records = [];
      document.getElementById('sourceList').innerHTML = '';
      document.getElementById('targetList').innerHTML = '';
      document.getElementById('sentenceCount').textContent = '0 句';
    }

    function exportMarkdown() {
      if (!state.records.length) return alert('暂无同传记录可导出');
      let md = `# 实时双语同传记录 (${new Date().toLocaleDateString()})\n\n`;
      state.records.forEach(r => {
        md += `**[${r.time}]**\n- 原文: ${r.source}\n- 译文: ${r.target}\n\n`;
      });
      const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `si-notes-${new Date().toISOString().slice(0,10)}.md`;
      a.click();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }
    function escapeAttr(s) {
      return String(s).replace(/"/g, '&quot;');
    }

    init();
  </script>
</body>
</html>
